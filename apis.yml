name: Clearbos (clearorthod)
description: >-
  Clearbos (clearorthod / 可丽尔博士) is a Chinese clear-aligner orthodontics company
  that designs and manufactures invisible teeth-alignment systems for adults and
  children, delivered through a network of partner dental clinics and
  orthodontists. Its digital treatment platform pairs the C4 adult-correction
  system with the C3 pediatric full-cycle system, and is supported by a
  doctor-facing web portal for case submission, treatment planning, and aligner
  ordering. The company reports more than 11,900 registered doctors and 9,200
  partner clinics across 321 cities. Clearbos was added to the API Evangelist
  network as a portfolio company of Qiming Venture Partners; no public developer
  API, OpenAPI, or /.well-known discovery surface was found during enrichment.
